<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Liga Jovem - Itens</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .card-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 15px; border-radius: 8px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-top: 10px; }
    .btn { padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; color: white; margin-right: 5px; }
    .btn-status { background-color: #28a745; }
    .btn-deletar { background-color: #dc3545; }
    .status-badge { font-weight: bold; text-transform: uppercase; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Cadastrar Item</h2>
  <form id="formItem">
    <input type="text" id="titulo" placeholder="Título" required><br><br>
    <textarea id="descricao" placeholder="Descrição"></textarea><br><br>
    <input type="file" id="imagem" accept="image/*"><br><br>
    <button type="submit">Guardar</button>
  </form>

  <hr>

  <h2>Itens Registados</h2>
  <div id="listaItens" class="card-container"></div>

  <script>
    async function carregarItens() {
      const res = await fetch('/api/itens');
      const itens = await res.json();

      const container = document.getElementById('listaItens');
      container.innerHTML = '';

      itens.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const imagemHtml = item.imagem 
          ? `<img src="${item.imagem}" alt="${item.titulo}">` 
          : '<p><em>Sem imagem</em></p>';

        card.innerHTML = `
          <h3>${item.titulo}</h3>
          <p>${item.descricao || ''}</p>
          <p>Status: <span class="status-badge">${item.status}</span></p>

          <button class="btn btn-status" onclick="alterarStatus(${item.id}, '${item.status === 'disponivel' ? 'resgatado' : 'disponivel'}')">
            ${item.status === 'disponivel' ? 'Resgatar' : 'Tornar Disponível'}
          </button>

          <button class="btn btn-deletar" onclick="eliminarItem(${item.id})">Apagar</button>

          <br>
          ${imagemHtml}
        `;

        container.appendChild(card);
      });
    }

    async function alterarStatus(id, novoStatus) {
      await fetch(`/api/itens/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: novoStatus })
      });
      carregarItens();
    }

    async function eliminarItem(id) {
      if (confirm('Deseja apagar este item?')) {
        await fetch(`/api/itens/${id}`, { method: 'DELETE' });
        carregarItens();
      }
    }

    document.getElementById('formItem').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('titulo', document.getElementById('titulo').value);
      formData.append('descricao', document.getElementById('descricao').value);

      const fileInput = document.getElementById('imagem');
      if (fileInput.files[0]) {
        formData.append('imagem', fileInput.files[0]);
      }

      await fetch('/api/itens', { method: 'POST', body: formData });
      document.getElementById('formItem').reset();
      carregarItens();
    });

    carregarItens();
  </script>
</body>
</html>
