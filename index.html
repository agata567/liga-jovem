<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Liga Jovem - Gestão de Itens</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; text-align: center; }
    .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; margin: 8px 0; }
    .disponivel { background: #d4edda; color: #155724; }
    .resgatado { background: #f8d7da; color: #721c24; }
    .btn { padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; margin: 4px; color: white; }
    .btn-resgatar { background: #28a745; }
    .btn-deletar { background: #dc3545; }
  </style>
</head>
<body>

  <h1>Cadastro e Lista de Itens</h1>

  <!-- Formulário de Cadastro -->
  <form id="formItem" enctype="multipart/form-data">
    <input type="text" id="titulo" placeholder="Título" required><br><br>
    <textarea id="descricao" placeholder="Descrição"></textarea><br><br>
    <input type="file" id="imagem" accept="image/*"><br><br>
    <button type="submit">Cadastrar Item</button>
  </form>

  <hr>

  <h2>Itens Registados</h2>
  <div id="listaItens" class="grid"></div>

  <script>
    const API_URL = 'http://localhost:10000'; // Altere para a sua URL do Render no servidor

    // 1. Carregar e exibir itens
    async function carregarItens() {
      const res = await fetch(`${API_URL}/api/itens`);
      const itens = await res.json();
      
      const container = document.getElementById('listaItens');
      container.innerHTML = '';

      itens.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Caminho da imagem vindo do backend
        const imagemSrc = item.imagem ? `${API_URL}${item.imagem}` : 'https://via.placeholder.com/150';

        card.innerHTML = `
          <h3>${item.titulo}</h3>
          <p>${item.descricao || ''}</p>
          <span class="status ${item.status}">${item.status}</span><br>
          <img src="${imagemSrc}" alt="${item.titulo}"><br><br>
          <button class="btn btn-resgatar" onclick="alterarStatus(${item.id}, '${item.status === 'disponivel' ? 'resgatado' : 'disponivel'}')">
            ${item.status === 'disponivel' ? 'Resgatar' : 'Tornar Disponível'}
          </button>
          <button class="btn btn-deletar" onclick="eliminarItem(${item.id})">Apagar</button>
        `;
        container.appendChild(card);
      });
    }

    // 2. Alternar Status (Resgatar/Disponibilizar)
    async function alterarStatus(id, novoStatus) {
      await fetch(`${API_URL}/api/itens/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: novoStatus })
      });
      carregarItens();
    }

    // 3. Eliminar Item
    async function eliminarItem(id) {
      if (confirm('Tem certeza que deseja apagar este item?')) {
        await fetch(`${API_URL}/api/itens/${id}`, { method: 'DELETE' });
        carregarItens();
      }
    }

    // 4. Cadastrar Item com foto
    document.getElementById('formItem').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('titulo', document.getElementById('titulo').value);
      formData.append('descricao', document.getElementById('descricao').value);
      
      const fileInput = document.getElementById('imagem');
      if (fileInput.files[0]) {
        formData.append('imagem', fileInput.files[0]);
      }

      await fetch(`${API_URL}/api/itens`, {
        method: 'POST',
        body: formData
      });

      document.getElementById('formItem').reset();
      carregarItens();
    });

    // Carrega ao abrir a página
    carregarItens();
  </script>
</body>
</html>
