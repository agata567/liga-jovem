<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achados e Perdidos - Escola</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos para garantir que as imagens fiquem organizadas dentro dos cards */
    .item-media {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin: 10px 0;
      display: block;
      background-color: #eee;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔍 Achados e Perdidos</h1>
    <div class="nav-buttons">
      <a href="cadastrar_item.html" class="btn">+ Novo Item</a>
    </div>
  </header>

  <main>
    <div id="listaItens">
      <!-- Os itens vão aparecer aqui via JS -->
    </div>
  </main>

  <script>
    async function carregarItens() {
      const container = document.getElementById('listaItens');
      
      try {
        const res = await fetch('http://localhost:3000/api/itens');
        const itens = await res.json();

        if (itens.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhum item registado no momento.</p>';
          return;
        }

        container.innerHTML = itens.map(item => {
          // Só gera a tag <img> se existir um caminho de imagem guardado na BD
          const imagemHtml = item.imagem_url 
            ? `<img src="http://localhost:3000${item.imagem_url}" alt="Imagem de ${item.nome}" class="item-media">` 
            : '';

          return `
            <div class="item-card">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <span class="badge">${item.categoria}</span>
                <button onclick="eliminarItem(${item.id})" class="btn-delete" title="Apagar item">🗑️</button>
              </div>
              <h3>${item.nome}</h3> <!-- Corrigido de item.titulo para item.nome -->
              
              ${imagemHtml} <!-- A imagem aparece logo abaixo do título se existir -->
              
              <p>${item.descricao || 'Sem descrição adicional.'}</p>
              <p><strong>📍 Local:</strong> ${item.local_encontrado}</p>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Erro ao carregar itens:', err);
        container.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar lista de itens.</p>';
      }
    }

    async function eliminarItem(id) {
      if (!confirm('Tem a certeza que deseja eliminar este item?')) return;

      try {
        const res = await fetch(`http://localhost:3000/api/itens/${id}`, { method: 'DELETE' });
        if (res.ok) {
          carregarItens(); // Atualiza a lista automaticamente
        } else {
          alert('Erro ao eliminar item.');
        }
      } catch (err) {
        alert('Servidor indisponível.');
      }
    }

    carregarItens();
  </script>
</body>
</html>
