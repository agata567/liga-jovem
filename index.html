<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural - Achados e Perdidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mural de Itens Encontrados</h1>
    <div class="nav-buttons">
      <a href="cadastrar_item.html" class="btn">+ Registo de Item</a>
    </div>
  </header>

  <main id="listaItens">
    <p style="text-align: center; color: var(--text-muted);">A carregar itens...</p>
  </main>

  <script>
    async function carregarItens() {
      const container = document.getElementById('listaItens');
      try {
        const response = await fetch('http://localhost:3000/api/itens');
        const itens = await response.json();

        container.innerHTML = '';

        if (itens.length === 0) {
          container.innerHTML = '<p style="text-align: center;">Nenhum item registado até ao momento.</p>';
          return;
        }

        itens.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <span class="badge">${item.categoria}</span>
            <h3>${item.titulo}</h3>
            <p><strong>Local:</strong> ${item.local_encontrado}</p>
            <p>${item.descricao || 'Sem descrição adicional.'}</p>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Erro ao procurar itens:', err);
        container.innerHTML = '<p style="text-align: center; color: red;">Não foi possível carregar os itens do servidor.</p>';
      }
    }

    carregarItens();
  </script>
</body>
</html>
