<script>
  // URL da API (altere para a URL do Render em produção)
  const API_URL = 'http://localhost:3001/api/utilizadores';

  // Função para evitar vulnerabilidades de XSS ao renderizar textos do utilizador
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Carrega os utilizadores ao abrir a página
  async function carregarUtilizadores() {
    const container = document.getElementById('listaUtilizadores');
    if (!container) return;

    try {
      const res = await fetch(API_URL);
      const utilizadores = await res.json();

      if (!Array.isArray(utilizadores) || utilizadores.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666;">Nenhum utilizador registado até ao momento.</p>';
        return;
      }

      container.innerHTML = utilizadores.map(user => {
        const dataCriacao = new Date(user.criado_em).toLocaleDateString('pt-PT');

        return `
          <div class="card-utilizador" style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
            <h3 style="margin: 0 0 5px 0;">${escapeHTML(user.nome)}</h3>
            <p style="margin: 0 0 5px 0;"><strong>E-mail:</strong> ${escapeHTML(user.email)}</p>
            <small style="color: #888;">Registado em: ${dataCriacao}</small>
          </div>
        `;
      }).join('');

    } catch (err) {
      console.error('Erro ao carregar utilizadores:', err);
      container.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar a lista de utilizadores. Verifique se o servidor está ativo.</p>';
    }
  }

  // Inicializa o carregamento da lista
  carregarUtilizadores();
</script>
