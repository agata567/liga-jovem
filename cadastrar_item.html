<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Item - Achados e Perdidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Achados e Perdidos</h1>
    <div class="nav-buttons">
      <a href="index.html" class="btn btn-secondary">Ver Lista de Itens</a>
    </div>
  </header>

  <main>
    <form id="formCadastro">
      <h2>Cadastrar Novo Item</h2>
      
      <div class="form-group">
        <label for="titulo">Nome do Objeto</label>
        <input type="text" id="titulo" placeholder="Ex: Casaco azul, Chaveiro..." required>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione...</option>
          <option value="Eletrónicos">Eletrónicos</option>
          <option value="Roupas">Roupas</option>
          <option value="Documentos">Documentos / Material</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="local">Local Onde Foi Encontrado</label>
        <input type="text" id="local" placeholder="Ex: Pátio, Sala 12, Cantina" required>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição Detalhada</label>
        <textarea id="descricao" rows="3" placeholder="Insira detalhes como cor, marca ou marcas de uso..."></textarea>
      </div>

      <button type="submit" class="btn">Registar Item</button>
    </form>
  </main>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const itemData = {
        titulo: document.getElementById('titulo').value,
        categoria: document.getElementById('categoria').value,
        local_encontrado: document.getElementById('local').value,
        descricao: document.getElementById('descricao').value
      };

      try {
        const response = await fetch('http://localhost:3000/api/itens', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(itemData)
        });

        if (response.ok) {
          alert('Item registado com sucesso!');
          window.location.href = 'index.html'; // Redireciona para a lista
        } else {
          alert('Ocorreu um erro ao registar o item.');
        }
      } catch (err) {
        console.error('Erro ao ligar ao servidor:', err);
        alert('Servidor indisponível. Verifique se o Back-End está em execução.');
      }
    });
  </script>
</body>
</html>
