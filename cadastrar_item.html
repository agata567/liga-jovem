<script>
  // URL base da API local
  const API_URL = 'http://localhost:3001/api/utilizadores';

  const btnSubmit = document.getElementById('btnSubmit');

  // Envio do formulário
  document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();

    // Bloqueia o botão para evitar envios duplicados
    btnSubmit.disabled = true;
    const textoOriginal = btnSubmit.textContent;
    btnSubmit.textContent = 'A registar...';

    // Obtém os dados dos inputs do formulário
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();

    try {
      // Faz o pedido POST enviando JSON para o Node.js
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ nome, email })
      });

      const dados = await response.json();

      if (response.ok) {
        alert(dados.message || 'Utilizador registado com sucesso!');
        window.location.href = 'index.html'; // Redireciona para a lista
      } else {
        alert(`Ocorreu um erro: ${dados.error || 'Erro desconhecido'}`);
      }
    } catch (err) {
      console.error('Erro ao ligar ao servidor:', err);
      alert('Servidor indisponível. Verifique se o server.js está a rodar no terminal.');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = textoOriginal;
    }
  });
</script>
