<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Item - Achados e Perdidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Achados e Perdidos</h1>
    <div class="nav-buttons">
      <a href="index.html" class="btn btn-secondary">Ver Lista de Itens</a>
    </div>
  </header>

  <main>
    <form id="formCadastro" enctype="multipart/form-data"> <!-- Adicionado suporte a ficheiros no form -->
      <h2>Cadastrar Novo Item</h2>
      
      <div class="form-group">
        <label for="titulo">Nome do Objeto</label>
        <!-- Mantido o id="titulo" no HTML para não quebrar estilos, mas mapeado como "nome" no JS -->
        <input type="text" id="titulo" placeholder="Ex: Casaco azul, Chaveiro..." required>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione...</option>
          <option value="Eletrónicos">Eletrónicos</option>
          <option value="Roupas">Roupas</option>
          <option value="Documentos">Documentos / Material</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="local">Local Onde Foi Encontrado</label>
        <input type="text" id="local" placeholder="Ex: Pátio, Sala 12, Cantina" required>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição Detalhada</label>
        <textarea id="descricao" rows="3" placeholder="Insira detalhes como cor, marca ou marcas de uso..."></textarea>
      </div>

      <!-- Novo campo para carregar a foto do item -->
      <div class="form-group">
        <label for="imagem">Foto do Item (Opcional)</label>
        <input type="file" id="imagem" accept="image/*">
      </div>

      <button type="submit" class="btn">Registar Item</button>
    </form>
  </main>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Instancia o FormData para agrupar textos e ficheiros binários
      const formData = new FormData();
      
      // Mapeia os dados nos campos esperados pelo seu Back-End (nome, categoria, local_encontrado, descricao)
      formData.append('nome', document.getElementById('titulo').value);
      formData.append('categoria', document.getElementById('categoria').value);
      formData.append('local_encontrado', document.getElementById('local').value);
      formData.append('descricao', document.getElementById('descricao').value);

      // Verifica se o utilizador selecionou alguma imagem antes de anexar
      const inputImagem = document.getElementById('imagem');
      if (inputImagem.files.length > 0) {
        formData.append('imagem', inputImagem.files[0]); // O nome 'imagem' deve ser igual ao do upload.single('imagem') no backend
      }

      try {
        const response = await fetch('http://localhost:3000/api/itens', {
          method: 'POST',
          // ATENÇÃO: Não adicione 'Content-Type' nos headers. O browser define o boundary automaticamente ao enviar um FormData.
          body: formData 
        });

        if (response.ok) {
          alert('Item registado com sucesso!');
          window.location.href = 'index.html'; // Redireciona para a lista
        } else {
          const erro = await response.json();
          alert(`Ocorreu um erro ao registar o item: ${erro.error || 'Erro desconhecido'}`);
        }
      } catch (err) {
        console.error('Erro ao ligar ao servidor:', err);
        alert('Servidor indisponível. Verifique se o Back-End está em execução.');
      }
    });
  </script>
</body>
</html>
