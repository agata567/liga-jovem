<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Item - Liga Jovem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    Escola Cívico-Militar 11 DE OUTUBRO • Seção de Achados e Perdidos
  </div>

  <header>
    <div class="header-container">
      <div>
        <h1>Cadastrar Novo Item</h1>
        <p>Registe objetos encontrados nas instalações escolares</p>
      </div>
      <a href="index.html" class="btn-header">Voltar à Lista</a>
    </div>
  </header>

  <main>
    <div class="form-container">
      <form id="formCadastro">
        <label for="titulo">Título do Item *</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Casaco azul, Relógio de pulso..." required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Detalhes sobre o item, local onde foi encontrado..."></textarea>

        <label for="status">Estado</label>
        <select id="status" name="status">
          <option value="disponível">Disponível</option>
          <option value="resgatado">Resgatado</option>
        </select>

        <label for="imagem">Imagem do Item</label>
        <input type="file" id="imagem" name="imagem" accept="image/*">

        <button type="submit" id="btnSubmit">Cadastrar Item</button>
      </form>
    </div>
  </main>

  <script>
    // URL do backend no Render configurada!
    const API_BASE = 'https://liga-jovem.onrender.com';

    const form = document.getElementById('formCadastro');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.innerText = 'A guardar...';

      const formData = new FormData(form);

      try {
        const res = await fetch(`${API_BASE}/api/itens`, {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          alert('Item cadastrado com sucesso!');
          window.location.href = 'index.html';
        } else {
          const errData = await res.json().catch(() => ({}));
          alert(errData.error || 'Erro ao cadastrar o item.');
        }
      } catch (err) {
        console.error('Erro na submissão:', err);
        alert('Servidor indisponível. Aguarde alguns instantes e tente novamente caso o Render esteja a inicializar.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Cadastrar Item';
      }
    });
  </script>
</body>
</html>
