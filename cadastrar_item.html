<script>
  // URL base da API alojada no Render
  const API_URL = 'https://SEU-APP-NO-RENDER.onrender.com/api/itens';

  const inputImagem = document.getElementById('imagem');
  const previewContainer = document.getElementById('previewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const btnSubmit = document.getElementById('btnSubmit');

  // Pré-visualização da imagem antes do envio
  inputImagem.addEventListener('change', function () {
    const file = this.files[0];

    if (file) {
      if (file.size > 5 * 1024 * 1024) { // Limite de 5MB
        alert('A imagem selecionada excede o limite de 5MB.');
        this.value = '';
        previewContainer.style.display = 'none';
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        previewContainer.style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else {
      previewContainer.style.display = 'none';
    }
  });

  // Envio do formulário
  document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();

    // Bloqueia o botão para evitar envios duplicados
    btnSubmit.disabled = true;
    const textoOriginal = btnSubmit.textContent;
    btnSubmit.textContent = 'A registar...';

    const formData = new FormData();
    formData.append('nome', document.getElementById('titulo').value.trim());
    formData.append('categoria', document.getElementById('categoria').value);
    formData.append('local_encontrado', document.getElementById('local').value.trim());
    formData.append('descricao', document.getElementById('descricao').value.trim());

    if (inputImagem.files.length > 0) {
      formData.append('imagem', inputImagem.files[0]);
    }

    try {
      // Faz o pedido POST diretamente para a URL do Render
      const response = await fetch(API_URL, {
        method: 'POST',
        body: formData 
      });

      if (response.ok) {
        alert('Item registado com sucesso!');
        window.location.href = 'index.html';
      } else {
        const erro = await response.json();
        alert(`Ocorreu um erro ao registar o item: ${erro.error || 'Erro desconhecido'}`);
      }
    } catch (err) {
      console.error('Erro ao ligar ao servidor:', err);
      alert('Servidor indisponível. Verifique se o serviço no Render está ativo.');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = textoOriginal;
    }
  });
</script>
